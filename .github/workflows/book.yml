name: Build the book

# Rebuilds the website and the free PDF whenever the book changes on main,
# and publishes them with GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "build_book.py"
      - "book_tools.py"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install PyMuPDF (for the PDF's bookmarks)
        run: pip install pymupdf==1.26.7
      - name: Build the website and the PDF
        run: python build_book.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

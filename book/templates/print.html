<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Warm Prior: Stories from a Fiction Machine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono&display=swap">
<style>
@page{size:5.5in 8.5in;margin:.85in .75in .9in}
@page :first{margin:0}
html{font-family:"EB Garamond",Georgia,serif;font-size:11pt;line-height:1.5;color:#1d1d1b}
body{margin:0}
.title{height:8.5in;display:flex;flex-direction:column;justify-content:center;padding:0 .75in;page-break-after:always}
.title h1{font-weight:400;font-size:32pt;line-height:1.05;margin:0 0 .25in}
.title p{margin:0;font-size:12pt}
.title .sub{font-style:italic;font-size:15pt;margin:-.15in 0 .3in}
.title .small{margin-top:.6in;font-family:"IBM Plex Mono",monospace;font-size:7.5pt;color:#6c6b66}
.toc{page-break-after:always}
.toc h2,.colophon h2{font-weight:400;font-size:16pt;margin:0 0 .25in}
.toc ol{list-style:none;padding:0;margin:0}
.toc li{display:flex;gap:.18in;margin-bottom:.12in;align-items:baseline}
.toc .n{font-family:"IBM Plex Mono",monospace;font-size:8pt;color:#6c6b66;width:.25in;flex:none}
.toc .t{font-size:12.5pt}
.toc .r{font-size:9pt;color:#6c6b66;display:block}
.chapter{page-break-before:always}
.chapter .num{font-family:"IBM Plex Mono",monospace;font-size:8pt;letter-spacing:.12em;text-transform:uppercase;color:#6c6b66;margin-top:.6in}
.chapter h2{font-weight:400;font-size:22pt;line-height:1.1;margin:.08in 0 .35in}
.story p{margin:0;text-indent:1.3em;text-align:justify;hyphens:auto}
.story p:first-child,.story hr+p{text-indent:0}
.story hr{border:0;text-align:center;margin:.15in 0}
.story hr::after{content:"⁂";color:#6c6b66}
.note{margin-top:.35in;padding-top:.12in;border-top:.5pt solid #1d1d1b;font-size:8.5pt;page-break-inside:avoid}
.note dl{display:grid;grid-template-columns:.8in 1fr;gap:.04in .12in;margin:0}
.note dt{color:#6c6b66}
.note dd{margin:0}
.note .mono{font-family:"IBM Plex Mono",monospace;font-size:7.5pt}
.colophon{page-break-before:always;font-size:9.5pt}
.colophon p{margin:0 0 .12in}
</style>
</head>
<body>
__BODY__
</body>
</html>

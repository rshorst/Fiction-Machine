<title>Warm Prior</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: one reading column, like a page of a book; contents and chapters are separate views. Apparatus in plain sans, the story in Garamond (the machine's own PDF face), editor's red pencil as the only accent. */
:root{
  --paper:#fbfbfa; --ink:#1d1d1b; --muted:#6c6b66; --rule:#e2e1dc; --pencil:#b3261e; --wash:#f3f2ef;
  --serif:"EB Garamond", "Iowan Old Style", Georgia, serif;
  --sans:"Public Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --measure:34rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#161615;--ink:#e9e7e2;--muted:#9c9a93;--rule:#33322f;--pencil:#ef8a7e;--wash:#1e1e1c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#161615;--ink:#e9e7e2;--muted:#9c9a93;--rule:#33322f;--pencil:#ef8a7e;--wash:#1e1e1c;color-scheme:dark}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--pencil);outline-offset:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:46rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.7rem;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar-in a{text-decoration:none;color:var(--ink)}
.bar-in a:hover{color:var(--pencil)}
.bar .where{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.progress{height:2px;background:var(--pencil);width:0;transition:width .1s linear}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:3.5rem 5rem}
.view{max-width:46rem;margin:0 auto}

/* Contents */
.titlepage{display:grid;gap:1.1rem;padding-bottom:3rem;border-bottom:1px solid var(--rule)}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.titlepage h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,7vw,4.4rem);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
.titlepage .lede{font-family:var(--serif);font-size:1.3rem;line-height:1.45;max-width:30rem;margin:0}
.titlepage .sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,3vw,1.7rem);margin:-.4rem 0 0;color:var(--muted)}
.wip{display:inline-block;font-family:var(--mono);font-size:.72rem;color:var(--pencil);border:1px solid currentColor;padding:.1rem .45rem;border-radius:2px;margin-left:.4rem;vertical-align:middle;letter-spacing:0;text-transform:none}
.toc{list-style:none;margin:0;padding:0}
.toc li{border-bottom:1px solid var(--rule)}
.toc a{display:grid;grid-template-columns:3.2rem 1fr auto;gap:.3rem 1rem;padding-block:1.4rem;text-decoration:none;align-items:baseline}
.toc .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.toc .t{font-family:var(--serif);font-size:1.6rem;line-height:1.2;min-width:0}
.toc .d{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.toc .s{grid-column:2 / 4;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:1.05rem;line-height:1.45;min-width:0}
.toc a:hover .t{color:var(--pencil)}
.section-h{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:3.5rem 0 .5rem}
.add{display:grid;gap:1rem;background:var(--wash);padding:1.6rem 1.6rem 1.8rem;margin-top:3.5rem}
.add h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.6rem}
.add ol{margin:0;padding-left:1.2rem;display:grid;gap:.6rem;max-width:36rem}
.add code{font-family:var(--mono);font-size:.85em;background:var(--paper);padding:.05rem .3rem}
.add p{margin:0;max-width:36rem;color:var(--muted)}
.colophon{margin-top:3rem;font-size:.85rem;color:var(--muted);max-width:36rem}
.actions{display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:center;margin-top:.4rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--ink);color:var(--paper);text-decoration:none;padding:.7rem 1.1rem;font-size:.9rem;font-weight:500}
.btn:hover{background:var(--pencil)}
.btn small{font-weight:400;opacity:.75}
.textlink{font-size:.9rem;color:var(--ink);text-underline-offset:3px}
.textlink:hover{color:var(--pencil)}
.dl-mini{flex:none;border:1px solid var(--rule);padding:.15rem .5rem}
.toc .r{color:var(--muted)}

/* Chapter */
.chap-head{max-width:var(--measure);margin:0 auto 2.8rem;display:grid;gap:.9rem}
.chap-head h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,3.3rem);line-height:1.05;margin:0;text-wrap:balance}
.chap-head .seedline{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:1.1rem;line-height:1.45;margin:0}
.story{max-width:var(--measure);margin:0 auto;font-family:var(--serif);font-size:1.22rem;line-height:1.62;hyphens:auto;-webkit-hyphens:auto}
.story p{margin:0;text-indent:1.4em}
.story p:first-child,.story hr+p{text-indent:0}
.story p:first-child::first-line{font-variant:small-caps;letter-spacing:.04em}
.story hr{border:0;margin:1.6rem auto;text-align:center;height:1.4rem}
.story hr::after{content:"⁂";color:var(--muted)}
.story blockquote{margin:1rem 1.4em;font-size:1.1rem}
.note{max-width:var(--measure);margin:3.5rem auto 0;border-top:1px solid var(--ink);padding-top:1.2rem;display:grid;gap:1rem}
.note h2{margin:0;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.note dl{margin:0;display:grid;grid-template-columns:7.5rem 1fr;gap:.55rem 1rem;font-size:.9rem}
.note dt{color:var(--muted)}
.note dd{margin:0;min-width:0}
.note dd.mono{font-family:var(--mono);font-size:.82rem}
.note dd.seed{font-family:var(--serif);font-size:1.05rem;line-height:1.45}
.pager{max-width:var(--measure);margin:3rem auto 0;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.pager a{text-decoration:none;display:grid;gap:.2rem;padding:1rem 0;border-top:1px solid var(--rule)}
.pager a:last-child{text-align:right}
.pager small{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:1.2rem}
.pager a:hover span{color:var(--pencil)}
@media (max-width:560px){
  .toc a{grid-template-columns:2.2rem 1fr}
  .toc .d{grid-column:2}
  .toc .s{grid-column:2}
  .story{font-size:1.12rem}
  .note dl{grid-template-columns:1fr;gap:.15rem}
  .note dd{margin-bottom:.6rem}
  .add{padding:1.2rem}
}
@media (prefers-reduced-motion:reduce){.progress{transition:none}}
</style>

<div class="bar"><div class="bar-in"><a href="#contents">Warm Prior</a><span class="where" id="where">Contents</span><a class="dl-mini" href="warm-prior.pdf">PDF</a></div><div class="progress" id="progress"></div></div>
<main><div class="view" id="view"></div></main>

<script id="data" type="application/json">__CHAPTERS__</script>
<script>
const BOOK = JSON.parse(document.getElementById('data').textContent), CH = BOOK.chapters, UPDATED = BOOK.updated;
const view = document.getElementById('view'), where = document.getElementById('where'), bar = document.getElementById('progress');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total = CH.reduce((a,c)=>a+c.words,0);

function contents(){
  where.textContent = 'Contents';
  view.innerHTML = `
  <header class="titlepage">
    <h1>Warm Prior</h1>
    <p class="sub">Stories from a Fiction Machine</p>
    <p class="lede">Each chapter began as a single sentence. A crew of agents researched it, built its characters from photographs, then drafted, annotated, revised and cut it.</p>
    <div class="eyebrow">${CH.length} chapters · ${total.toLocaleString('en-CA')} words · April 2026 –</div>
    <div class="actions">
      <a class="btn" href="warm-prior.pdf">Download the book <small>PDF · free</small></a>
      <a class="textlink" href="diagram.html">How the machine works</a>
      <a class="textlink" href="__REPO__">The machine on GitHub</a>
    </div>
  </header>
  <ol class="toc">${CH.map((c,i)=>`
    <li><a href="#chapter-${i+1}">
      <span class="n">${String(i+1).padStart(2,'0')}</span>
      <span class="t">${esc(c.title)}</span>
      <span class="d">${c.date}</span>
      <span class="s">${esc(c.seed)}</span>
    </a></li>`).join('')}
  </ol>
  <section class="add" aria-labelledby="add-h">
    <h2 id="add-h">Add a chapter</h2>
    <ol>
      <li>Run the machine on a seed of your own (setup is on <a href="__REPO__">GitHub</a>).</li>
      <li>Run <code>python submit_chapter.py &lt;slug&gt;</code>. It turns your finished story into a chapter under your name and sends it in.</li>
      <li>Rachel reads it. Once she adds it, it appears here and in the PDF, in the order chapters arrive.</li>
    </ol>
    <p>Only the final story and its note become the chapter. Drafts, annotations and letters stay with you. Chapters are shared under CC BY-NC 4.0.</p>
  </section>
  <p class="colophon">The Fiction Machine (unslop.) was designed by Rachel Horst in April 2026. Each chapter is © the person who ran the machine, shared under CC BY-NC 4.0. Book updated ${UPDATED}.</p>`;
}

function chapter(i){
  const c = CH[i], prev = CH[i-1], next = CH[i+1];
  where.textContent = `Chapter ${i+1} · ${c.title}`;
  view.innerHTML = `
  <header class="chap-head">
    <div class="eyebrow">Chapter ${i+1}</div>
    <h1>${esc(c.title)}</h1>
    <p class="seedline">${esc(c.seed)}</p>
  </header>
  <article class="story">${c.html}</article>
  <aside class="note" aria-label="About this chapter">
    <h2>About this chapter</h2>
    <dl>
      <dt>Made</dt><dd>${c.date}</dd>
      <dt>Run by</dt><dd>${esc(c.run_by)}</dd>
      <dt>Seed</dt><dd class="seed">${esc(c.seed)}</dd>
      <dt>System</dt><dd>${esc(c.system)}, designed by ${esc(c.designer.replace(/\s*\(.*\)/,''))}</dd>
      <dt>Model</dt><dd class="mono">${esc(c.model)}</dd>
      <dt>Length</dt><dd>${c.words.toLocaleString('en-CA')} words</dd>
    </dl>
  </aside>
  <nav class="pager" aria-label="Chapters">
    ${prev ? `<a href="#chapter-${i}"><small>Previous</small><span>${esc(prev.title)}</span></a>` : `<a href="#contents"><small>Back to</small><span>Contents</span></a>`}
    ${next ? `<a href="#chapter-${i+2}"><small>Next</small><span>${esc(next.title)}</span></a>` : `<a href="#contents"><small>End of the book so far</small><span>Contents</span></a>`}
  </nav>`;
}

function route(){
  const m = location.hash.match(/^#chapter-(\d+)$/);
  const i = m ? +m[1]-1 : -1;
  if (i >= 0 && i < CH.length) chapter(i); else contents();
  window.scrollTo(0,0); progress();
}
function progress(){
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = location.hash.startsWith('#chapter') && h > 0 ? (scrollY / h * 100) + '%' : '0';
}
addEventListener('hashchange', route);
addEventListener('scroll', progress, {passive:true});
route();
</script>
